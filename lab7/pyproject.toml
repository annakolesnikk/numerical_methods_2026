[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-manager"
version = "0.7.0"
description = "Employee management application with database persistence (laboratory work No. 7, variant 6)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
employee-manager = "employee_manager.main:main"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]